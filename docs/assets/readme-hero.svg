    <rect x="650" width="630" height="420" fill="url(#dots)"/>
    <circle cx="1276" cy="-74" r="310" fill="#8296ff" opacity=".045"/>
    <circle cx="1258" cy="-74" r="236" fill="none" stroke="#a4b3ef" stroke-opacity=".09"/>
    <path d="M0 417H1280" stroke="#8c9fff" stroke-width="6"/>
