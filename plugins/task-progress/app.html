<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  const viewId = 'view-' + (globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));

  let viewRegistrationStarted = false;
  let viewRetryTimer = null;
  let viewRetryDelay = 1000;
  let viewRegistered = false;
  let viewTimer = null;
  let viewHeartbeatTimer = null;
  let registeredMode = null;
  let registeredSourceKey = null;
  let viewCheckBusy = false;
  let sourceSuperseded = false;
  let hiddenByFullscreen = false;
  let disposed = false;
  let bridgeReady = false;
  let busy = false;
  let silentRefresh = false;
  let refreshQueued = false;
  let pollTimer = null;
  let hasCurrentProgress = false;
  let latestProgress = null;
  let sessionWork = null;
  let latestStateRevision = null;
  let minimumStateRevision = null;
  let fullHistorySnapshot = null;
  let historyLoad = null;
  let historyLoadError = "";

  let viewSource = null;
  let inlineViewSource = null;

  let lastCheckedAt = '';

  let hostCapabilities = {};
  let rpcId = 0;
  const pending = new Map();
  const statusInfo = value => {
    if (value === 'completed' || value === 'complete' || value === 'resolved') return { key: 'completed', label: '已完成' };
    if (value === 'in_progress' || value === 'running' || value === 'executing') return { key: 'running', label: '进行中' };
    const labels = { ready: '可执行', blocked: '依赖阻塞', finished: '执行结束', open: '仍未解决', failed: '执行失败', cancelled: '已取消', awaiting_review: '待主会话验收', waiting_synthesis: '待汇总验收', decomposing: '子任务可执行' };

    return { key: 'pending', label: '待开始' };
  };
  function syncPresentation() {
    const compact = displayMode !== 'fullscreen' && sourceSuperseded;
    const card = document.querySelector('.card');
    card.classList.toggle('compact', compact);
    card.classList.toggle('tab-hidden', displayMode === 'inline' && hiddenByFullscreen);

    reportHeight();
    if (displayMode === 'inline' && hiddenByFullscreen) {
      return;
    }
    if (!compact) return;
    setText('compact-title', latestProgress?.task_title || '当前会话任务');
    setText('compact-status', sourceSuperseded
      ? '任务状态可能已更新，打开查看最新进度。'
      : latestProgress ? statusInfo(latestProgress.status).label + ' · ' + (latestProgress.percent ?? 0) + '%'

  }
  const isInlineStale = () => displayMode === 'inline' && sourceSuperseded;
  const canPoll = () => !isInlineStale() && !hiddenByFullscreen && !disposed && hasCurrentProgress && bridgeReady && !!sessionId && documentVisible && cardInViewport;

    status.classList.toggle('failed', refreshFailed);

  }
  function stopPolling() {
    if (pollTimer !== null) { clearInterval(pollTimer); pollTimer = null; }
  }

    syncAutoRefreshStatus();

      lastReportedHeight = height;
      notify('ui/notifications/size-changed', { height });
    }
  }
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = ++rpcId;
    const timeout = setTimeout(() => { pending.delete(id); reject(new Error('宿主响应超时，请重新打开进度卡片。')); }, 15000);

    window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
  });
  function stopViewChecks() {
    if (viewTimer !== null) { clearInterval(viewTimer); viewTimer = null; }
  }
  function stopViewHeartbeat() {
    if (viewHeartbeatTimer !== null) { clearInterval(viewHeartbeatTimer); viewHeartbeatTimer = null; }
  }
  function stopViewRetry() {
    if (viewRetryTimer !== null) { clearTimeout(viewRetryTimer); viewRetryTimer = null; }
  }
  function startViewChecks() {
    if (displayMode !== 'inline' || !viewRegistered || viewTimer !== null || disposed) return;
    viewTimer = window.setInterval(() => { void checkLatestView(); }, 3000);
  }
  function startViewHeartbeat() {

  }

      registeredMode = null;

        render(null);
      } else {
        setError('正在读取本会话最新任务…');
        void refreshProgress(true);
      }
      return;
    }
    if (disposed) return;
    sourceSuperseded = true;
    hiddenByFullscreen = false;
    stopPolling(); stopViewHeartbeat(); stopViewRetry();
    if (reason === 'missing_progress') stopViewChecks();
    else startViewChecks();
    document.querySelector('.card').classList.add('inline-stale');
    setText('superseded-notice', reason === 'missing_progress' ? '此会话的任务进度已清除，卡片已折叠。' : '此进度卡片已折叠，请查看本会话最新的任务进度。');

    syncButton();
    reportHeight();
  }
  function restoreInlineView(hidden = false) {
    const wasStale = sourceSuperseded;
    const wasHidden = hiddenByFullscreen;
    sourceSuperseded = false;
    hiddenByFullscreen = hidden;

    $('superseded-notice').classList.add('hidden');

  }
  async function checkLatestView() {
    if (displayMode !== 'inline' || !viewRegistered || !bridgeReady || !sessionId || disposed || viewCheckBusy || !documentVisible) return;

    viewCheckBusy = true;
    try {
      const result = await request('tools/call', { name: 'check_ui_view', arguments: { session_id: sessionId, view_id: viewId, display_mode: displayMode } });
      const state = result?.structuredContent;

  async function registerView(force = false) {
    const source = displayMode === 'inline' ? inlineViewSource || viewSource : viewSource;
    if (!['inline', 'fullscreen'].includes(displayMode) || !bridgeReady || !sessionId || !source || viewRegistrationStarted || viewRetryTimer !== null || disposed) return;

    const requestedMode = displayMode;
    const requestedModeGeneration = modeGeneration;
    const generation = viewGeneration;
    if (!force && viewRegistered && registeredMode === requestedMode && registeredSourceKey === sourceKey) return;
    // Fullscreen views renew a short lease; inline cards never reclaim newer snapshots.
    viewRegistrationStarted = true;
    try {
      const result = await request('tools/call', { name: 'register_ui_view', arguments: { session_id: sessionId, view_id: viewId, ...source, display_mode: requestedMode, mode_generation: requestedModeGeneration } });
      if (disposed || generation !== viewGeneration || requestedMode !== displayMode) return;
      const state = result?.structuredContent;
      if (!result?.isError && state?.session_id === sessionId && state.view_id === viewId && ['superseded', 'missing_progress'].includes(state.status)) {
        viewRegistered = requestedMode === 'inline' && state.status === 'superseded';
        registeredMode = viewRegistered ? requestedMode : null;
        registeredSourceKey = viewRegistered ? sourceKey : null;
        collapseSupersededView(state.status); return;
      }
      if (!result?.isError && state?.session_id === sessionId && state.view_id === viewId && state.status === 'duplicate_fullscreen') {
        viewRegistered = false;
        registeredMode = null;
        setError('本会话已有完整进度页打开，正在返回会话内视图。');
        try {
          if (typeof window.openai?.requestDisplayMode === 'function') await window.openai.requestDisplayMode({ mode: 'inline' });

        return;
      }
      if (disposed || result?.isError || state?.session_id !== sessionId || state.view_id !== viewId || state.is_latest !== true) return;

      registeredMode = requestedMode;
      registeredSourceKey = sourceKey;
      viewRetryDelay = 1000;

  const setError = text => { setText('error', text); $('error').classList.toggle('hidden', !text); };
  const syncButton = () => {
    // Background polling must not blur a keyboard-focused refresh button.

  };
  const date = value => {
    if (!value) return '—';

  };
  const timestamp = value => {
    if (typeof value !== 'string' || !value.trim()) return null;
    const parsed = Date.parse(value);
    return Number.isFinite(parsed) ? parsed : null;
  };
  function appendElapsed(target, item, timeContext = null) {
    const start = timestamp(item.started_at);
    if (start === null) return;

      || ['completed', 'complete', 'resolved', 'open', 'finished', 'failed', 'cancelled'].includes(item.status);

    const cutoff = timeContext ? timestamp(timeContext.cutoff) : null;

      elapsed.title = '开始 ' + date(item.started_at) + '；快照截止时间未记录';

    } else {

      elapsed.title = '开始 ' + date(item.started_at) + (finish !== null ? '；结束 ' + date(item.finished_at) : timeContext ? '；快照截止 ' + date(timeContext.cutoff) : '；每 5 秒刷新');

  const list = value => Array.isArray(value) ? value : [];
  const legacyDetailsIncomplete = task => !!(task.nodes_truncated || task.details_unavailable || list(task.nodes).some(node=>node.details_unavailable));
  const nodesFrom = value => (Array.isArray(value) ? value : value && typeof value === 'object' ? Object.values(value) : []).filter(node => node && typeof node === 'object' && node.id);
  const printable = value => typeof value === 'string' ? value : value == null ? '' : typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
  const exportExecutor = assignment => {
    const data = assignment && typeof assignment === 'object' ? assignment : {};

  };
  const currentResponsibility = record => record.responsibility_version === 1 && !record.responsibility_legacy && record.review_status !== 'legacy_unrecorded';
  // A resolved submission is not accepted work. Legacy records retain their
  // outcome, but cannot manufacture an acceptance under today's protocol.
  const acceptedResolved = record => record.execution_status === 'finished' && record.outcome === 'resolved' && !record.invalidated_by && record.review_status !== 'pending' && record.review_status !== 'rejected' && (record.review_status === 'accepted' || (currentResponsibility(record) && (record.assignment?.execution_mode || record.planned_assignment?.execution_mode) === 'main_session'));
  function leafProgress(nodes) {
    const parents = new Set(nodes.filter(n=>n.parent_id != null).map(n=>String(n.parent_id)));

      pending:leaves.filter(n=>n.review_status==='pending').length,
      running:leaves.filter(n=>n.execution_status==='running').length,
      notStarted:leaves.filter(n=>n.execution_status==='pending' || !n.execution_status).length,
      unresolved:leaves.filter(n=>['finished','failed','cancelled'].includes(n.execution_status) && n.review_status!=='pending' && !acceptedResolved(n) && (n.outcome!=='resolved' || n.review_status==='rejected' || n.invalidated_by)).length,
