<style>
/* Compact the default task card while keeping task identity, status and assignments visible. */
body{padding:5px}
.card{border-radius:11px;box-shadow:0 3px 14px #0002}
.eyebrow{display:flex;gap:6px;font-size:9px;letter-spacing:.1em}
.brandmark{width:10px;height:10px}
.header{padding:12px 16px 10px}
.topline-actions{gap:5px}
.auto-refresh-status{font-size:9px}
.refresh{padding:5px 8px;font-size:11px}
.titleline{margin-top:8px;gap:8px}
h1{font-size:18px;line-height:1.35}
.badge{padding:3px 7px;font-size:10px}
.progressline{margin-top:10px}
.percent{font-size:27px}
.percent small{font-size:15px}
.track{height:5px;margin-top:6px}
.meta{gap:5px 14px;margin-top:7px;font-size:10px}
.network-meta{gap:3px 10px;margin-top:7px;font-size:10px;line-height:1.45}
.network-help,.step-id{display:none!important}
.steps-section{padding:10px 16px 2px}
.sectionline{margin-bottom:4px;font-size:10px}
.sectionline h2{font-size:11px}
.step{padding:7px 0}
.step-main{grid-template-columns:20px minmax(0,1fr) auto;gap:7px}
.step-icon{width:19px;height:19px}
.step-title{padding-top:1px;font-size:12px;line-height:1.35}
.step-right{gap:6px;padding-top:2px;font-size:9px}
.step-elapsed{font-size:9px}
.task-tree .children{margin-top:5px;margin-left:6px;padding-left:10px}
.task-details{gap:6px;margin-top:6px}
.detail-group{padding:6px 8px}
.assignment{font-size:10px}
.history-section{padding:8px 16px}
.task-history-summary{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}.task-history-name{flex:1 1 180px}.task-history-progress{font-size:10px;color:#91a5c7}.task-history-plans{margin-top:8px;padding-left:10px;border-left:1px solid #394355}.task-history-plans>summary{font-size:11px;color:#b9c3d1;cursor:pointer}
.history-section>summary{font-size:11px}
.history-list{margin-top:7px}

<body>
<main class="card" aria-label="任务进度">
  <p id="superseded-notice" class="superseded-notice hidden" role="status">此进度卡片已折叠，请查看本会话最新的任务进度。</p>
  <header class="header">
    <div class="topline"><div class="eyebrow"><span class="brandmark" aria-hidden="true"></span>Task Progress</div><div class="topline-actions"><span id="auto-refresh-status" class="auto-refresh-status hidden" aria-live="polite"><span class="auto-refresh-dot" aria-hidden="true"></span><span id="auto-refresh-label">自动刷新暂停</span><time id="auto-refresh-time" class="auto-refresh-time"></time></span><button class="refresh hidden" id="export-all" type="button" title="同时导出任务 Excel 和可视化 HTML">↓ 导出</button><button class="refresh" id="refresh" disabled title="刷新当前会话进度"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13 6A5.3 5.3 0 1 0 13 10M13 2v4H9"/></svg><span id="refresh-label">刷新</span></button></div></div>
    <div id="summary" class="hidden">
      <div class="titleline"><h1 id="task-title"></h1><span id="task-status" class="badge"><span class="dot" aria-hidden="true"></span><span id="task-status-label"></span></span></div>
      <div class="progressline"><div class="percent"><span id="percent">0</span><small>%</small></div><span id="fraction" class="fraction"></span></div>
      <div id="progressbar" class="track" role="progressbar" aria-label="任务完成比例" aria-valuemin="0" aria-valuemax="100"><div id="fill" class="fill"></div></div>
      <div class="meta"><span>开始 <time id="created"></time></span><span>更新 <time id="updated"></time></span></div><div id="network-meta" class="network-meta hidden"></div>
    </div>

        const label = document.createElement('summary'); label.textContent = '此任务的历史计划 · ' + task.history.length + ' 轮';
        const items = document.createElement('ol'); items.className = 'history-list'; items.append(planHistory(task, prefix, openDetails)); plans.append(label, items); details.append(plans);
      }
      li.append(details); fragment.append(li);
    });
    reconcileChildren($('task-history-list'), fragment);
  }

  function render(progress) {
    const hasProgress = !!progress && typeof progress === 'object';
    latestProgress = hasProgress ? progress : null;
    $('export-all').classList.toggle('hidden', !hasProgress || superseded || disposed);
    if (!hasProgress) $('export-feedback').classList.add('hidden');
    const steps = Array.isArray(progress?.steps) ? progress.steps : [];
    const network = progress?.schema_version === 2;
    const nodes = network ? nodesFrom(progress.nodes) : [];
    const openDetails = new Map(Array.from(document.querySelectorAll('details[data-key]')).map(el => [el.dataset.key, el.open]));
    renderTaskHistory(progress, openDetails);
    hasCurrentProgress = hasProgress;
    syncPolling();
    $('summary').classList.toggle('hidden', !hasProgress);
    $('steps-section').classList.toggle('hidden', !hasProgress);
    $('empty').classList.toggle('hidden', hasProgress);
    $('network-meta').classList.toggle('hidden', !hasProgress || !network);
    $('network-help').classList.toggle('hidden', !hasProgress || !network);
    setText('steps-title', network ? '当前任务 · 任务网络' : '当前任务 · 执行步骤');
    if (!network || !hasProgress) { $('history-section').classList.add('hidden'); $('history-list').replaceChildren(); }
    if (!hasProgress) { $('steps').replaceChildren(); syncButton(); return; }
    const state = statusInfo(progress.status);
    const total = Number.isFinite(progress.total) ? Math.max(0, progress.total) : network ? nodes.filter(node => !list(node.children).length).length : steps.length;
    const completed = Number.isFinite(progress.completed) ? Math.max(0, Math.min(total, progress.completed)) : network ? nodes.filter(node => !list(node.children).length && ['finished', 'failed', 'cancelled'].includes(node.execution_status)).length : steps.filter(s => s && statusInfo(s.status).key === 'completed').length;
    const rawPercent = Number.isFinite(progress.percent) ? progress.percent : total ? completed / total * 100 : 0;
    const percent = Math.max(0, Math.min(100, rawPercent));
    setText('task-title', String(progress.task_title || '未命名任务'));
    $('task-status').className = 'badge ' + state.key;
    setText('task-status-label', state.label);
    setText('percent', String(Math.round(percent)));
    setText('fraction', completed + ' / ' + total + (network ? ' 项执行结束' : ' 步已完成'));
    $('progressbar').setAttribute('aria-valuenow', String(percent));
    $('progressbar').setAttribute('aria-label', network ? '叶子任务执行结束比例' : '任务完成比例');
    $('fill').className = 'fill ' + state.key;
    $('fill').style.width = percent + '%';
    for (const [id, value] of [['created', progress.created_at], ['updated', progress.updated_at]]) {
      setText(id, date(value));
      $(id).title = typeof value === 'string' ? value : '';
      if (typeof value === 'string') $(id).dateTime = value; else $(id).removeAttribute('datetime');
    }
    setText('step-count', network ? nodes.length + ' 个节点 · ' + total + ' 个叶子任务' : total + ' 个步骤');
    if (network) { renderNetwork(progress, nodes, openDetails); syncButton(); return; }
    $('steps').className = 'steps';
    reconcileChildren($('steps'), linearSteps(steps, taskScope(progress) + ':steps', openDetails));
    syncButton();
  }
  $('export-all').addEventListener('click', exportCurrentProgress);
  function receiveResult(result, fromRefresh = false) {
    if (superseded || disposed) return;
    const structured = result?.structuredContent;
    if (!structured || typeof structured !== 'object') return;
    const incomingSession = structured.session_id || structured.progress?.session_id;
    // Each card stays bound to its original conversation, even if the host forwards another result.
    if (sessionId && incomingSession && incomingSession !== sessionId) return;
    if (typeof incomingSession === 'string' && incomingSession) sessionId = incomingSession;
    if (Object.prototype.hasOwnProperty.call(structured, 'progress')) {
      const incoming = structured.progress;
      const revision = structured.state_revision ?? incoming?.state_revision;
      const ordered = Number.isSafeInteger(revision) && revision >= 0;
      if (ordered) {
        if (latestStateRevision !== null && revision < latestStateRevision) return;
      } else {
        // Compatibility for cached old tool results: never replace a versioned
        // snapshot, and respect known task/epoch/revision order where available.
        if (latestStateRevision !== null) return;
        if (incoming && retiredTaskIds.has(taskIdentity(incoming))) return;
        if (incoming && latestProgress) {
          if (taskIdentity(incoming) === taskIdentity(latestProgress)) {
            if (Number(incoming.epoch || 0) < Number(latestProgress.epoch || 0)) return;
            if (Number(incoming.epoch || 0) === Number(latestProgress.epoch || 0) && Number(incoming.revision || 0) < Number(latestProgress.revision || 0)) return;
          } else if (list(latestProgress.task_history).some(task => taskIdentity(task) === taskIdentity(incoming))) return;
        }
      }
      if (latestProgress && (!incoming || taskIdentity(latestProgress) !== taskIdentity(incoming))) retiredTaskIds.add(taskIdentity(latestProgress));
      if (ordered) latestStateRevision = revision;
      // Only the original host result identifies this card. A polling result
      // must not turn a remounted historical card into the newest view.
      if (!initialResultSeen && !fromRefresh) {
        initialResultSeen = true;
        if (ordered && Number.isSafeInteger(structured.view_sequence) && incoming?.task_instance_id) {
          viewSource = { view_sequence: structured.view_sequence, state_revision: revision, task_instance_id: incoming.task_instance_id };
        }
      }
      lastCheckedAt = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      refreshFailed = false;
      setError(''); render(incoming); void registerView();
    }
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    if (message.id !== undefined && pending.has(message.id)) {
      const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timeout);
      if (message.error) item.reject(new Error(message.error.message || '宿主请求失败。')); else item.resolve(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-input' && !sessionId) {
      const value = message.params?.arguments?.session_id;
      if (typeof value === 'string' && value) { sessionId = value; syncButton(); void registerView(); }
    }
    if (message.method === 'ui/notifications/host-context-changed') {
      applyTheme(message.params || {});
      const nextMode = message.params?.displayMode;
      if (['inline', 'fullscreen', 'pip'].includes(nextMode) && nextMode !== displayMode) {
        displayMode = nextMode;
        if (displayMode === 'inline') {
          if (viewRegistered) { startViewChecks(); void checkLatestView(); }
          else void registerView();
        } else { stopViewChecks(); stopViewRetry(); }
      }
    }
    if (message.method === 'ui/notifications/tool-result') receiveResult(message.params);
    if (message.method === 'ui/resource-teardown' && message.id !== undefined) {
      disposed = true; stopPolling(); stopViewChecks(); stopViewRetry();
      window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');
    }
  });
  async function refreshProgress(silent = false) {
    if (!sessionId || !bridgeReady || busy || superseded || disposed) return;
    busy = true; silentRefresh = silent; syncButton();
    if (!silent) setError('');
    try {
      const result = await request('tools/call', { name: 'get_progress', arguments: { session_id: sessionId } });
      if (result?.isError) throw new Error('未能读取当前会话进度，请稍后刷新。');
      receiveResult(result, true);
    } catch (error) {
      refreshFailed = true;
      if (!silent) setError(error.message || '刷新失败，请稍后重试。');
    }
    finally { busy = false; silentRefresh = false; syncButton(); }
  }
  $('refresh').addEventListener('click', () => { void refreshProgress(false); });
  document.addEventListener('visibilitychange', () => {
    documentVisible = document.visibilityState === 'visible';
    syncPolling();
    if (documentVisible) void checkLatestView();
    if (canPoll()) void refreshProgress(true);
  });
  if (typeof IntersectionObserver !== 'undefined') {
    new IntersectionObserver(entries => {
      const wasVisible = cardInViewport;
      cardInViewport = entries.some(entry => entry.isIntersecting);
      syncPolling();
      if (!wasVisible && cardInViewport && canPoll()) void refreshProgress(true);
    }, { threshold: 0 }).observe(document.querySelector('.card'));
  }
  render(null);
  request('ui/initialize', { appInfo: { name: 'task-progress', version: '0.1.7' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
    .then(result => { displayMode = result?.hostContext?.displayMode ?? null; applyTheme(result?.hostContext || {}); hostCapabilities = result?.hostCapabilities ?? {}; bridgeReady = true; notify('ui/notifications/initialized', {}); notify('ui/notifications/size-changed', { height: Math.ceil(document.documentElement.getBoundingClientRect().height) }); syncButton(); syncPolling(); void registerView(); })
    .catch(error => setError(error.message || '无法连接进度卡片宿主。'));
  if (typeof ResizeObserver !== 'undefined') {
    let previousHeight = 0;
    new ResizeObserver(() => {
      const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (bridgeReady && height !== previousHeight) { previousHeight = height; notify('ui/notifications/size-changed', { height }); }
    }).observe(document.body);
  }
})();
</script>
</body>
