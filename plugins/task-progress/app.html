#detail-identity .detail-heading{flex:1 1 200px;min-width:0;margin:0;font-size:clamp(17px,2.3vw,21px);font-weight:650;line-height:1.45;overflow-wrap:anywhere;text-wrap:balance}
#detail-identity .detail-state{color:var(--workspace-muted);font-size:12px;line-height:1.5}
#step-dialog{--detail-green:#8bd1af;--detail-red:#efb3b6;--detail-amber:#e4c18f}
:root[data-theme=light] #step-dialog{--detail-green:#2c694a;--detail-red:#943a47;--detail-amber:#785321}
#detail-state[data-state=completed]{color:var(--detail-green)}
#detail-state[data-state=failed]{color:var(--detail-red)}
#detail-state:is([data-state=open],[data-state=awaiting_review],[data-state=waiting_synthesis]){color:var(--detail-amber)}
#detail-state[data-state=running]{color:var(--workspace-accent)}
#detail-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;border-bottom:1px solid var(--workspace-line);background:var(--workspace-surface);position:sticky;top:-4px;z-index:1}
#detail-tabs [role=tab]{min-width:0;margin:0 0 -1px;padding:8px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--workspace-muted);font:inherit;font-size:13px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}
#detail-tabs [role=tab][aria-selected=true]{border-color:var(--workspace-accent);color:var(--workspace-accent);font-weight:650}
#step-dialog [role=tabpanel]{min-width:0;overflow-wrap:anywhere;padding-block:14px 0}
#step-dialog [role=tabpanel][hidden]{display:none!important}
#step-dialog [role=tabpanel] :is(h3,h4){margin:0 0 5px;color:var(--workspace-ink);font-size:13px;line-height:1.5;font-weight:600}
#detail-panel-result .detail-result-section{margin:0 0 12px}
#detail-panel-result .detail-result-section:last-child{margin-bottom:0}
#detail-panel-result .detail-result-section p{margin:0;font-size:14px;line-height:1.65;color:var(--workspace-ink);white-space:pre-wrap;overflow-wrap:anywhere}
#step-dialog .detail-evidence-list{list-style:disc;margin:3px 0 0;padding-inline-start:18px}
#step-dialog .detail-evidence-list li{padding:2px 0;font-size:13px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
#step-dialog .detail-evidence-list li::marker{color:var(--workspace-muted)}
#step-dialog [role=tabpanel] a[href]{color:var(--workspace-accent);text-decoration:underline;text-underline-offset:2px}
.detail-timeline{list-style:none;margin:0;padding:0}
.detail-event{position:relative;margin:0;padding:0 0 15px 19px}
.detail-event::before{content:"";position:absolute;inset-inline-start:1px;top:5px;width:7px;height:7px;border-radius:50%;border:1px solid var(--workspace-muted);background:var(--workspace-surface)}
.detail-event:not(:last-child)::after{content:"";position:absolute;inset-inline-start:5px;top:15px;bottom:-2px;border-inline-start:1px solid var(--workspace-line)}
.detail-event[data-kind=accepted]::before{border-color:var(--detail-green);background:var(--detail-green)}
.detail-event:is([data-kind=failed],[data-kind=rejected])::before{border-color:var(--detail-red);background:var(--detail-red)}
.detail-event:is([data-kind=submitted],[data-kind=started])::before{border-color:var(--workspace-accent)}
.detail-event .detail-event-actor{display:inline-block;max-width:100%;margin-inline-start:0;color:var(--workspace-muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.detail-event time+.detail-event-actor{margin-inline-start:8px}
.detail-event:last-child{padding-bottom:0}
.detail-event-heading{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;gap:1px 10px;font-size:13px;font-weight:600;color:var(--workspace-ink)}
.detail-event time,.detail-round-label{font-size:11px;line-height:1.5;font-weight:400;font-variant-numeric:tabular-nums;color:var(--workspace-muted)}
.detail-event p,.detail-record-message{margin:3px 0;color:var(--workspace-ink);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
#detail-panel-records [data-retry-detail-records]{margin:4px 0;padding:6px 10px;border:1px solid var(--workspace-line);border-radius:6px;background:var(--workspace-paper);color:var(--workspace-accent);font:inherit;font-size:12px;cursor:pointer}
#detail-panel-raw .detail-group{margin:0;padding:0;border:0;border-radius:0;background:transparent}
#detail-panel-raw .detail-group~.detail-group{border-top:1px solid var(--workspace-line)}
#detail-panel-raw summary{list-style-position:inside;min-height:32px;box-sizing:border-box;padding:6px 2px;color:var(--workspace-ink);cursor:pointer;font-size:13px;line-height:1.55}
#detail-panel-raw .detail-group-content{padding:0 2px 8px}
#detail-panel-raw :is(.detail-value,.detail-preview,pre,code){max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap}
#detail-panel-raw :is(.detail-label,.detail-preview){color:var(--workspace-muted)}
#detail-panel-raw .detail-value{font-size:12px;line-height:1.6;color:var(--workspace-ink)}
#detail-panel-raw .detail-label{font-size:11px;line-height:1.5}
#detail-panel-raw .detail-field{margin-block:4px 7px}
#detail-panel-raw .raw-facts{display:grid;gap:4px;margin:0 0 12px}
.raw-facts>div{display:grid;grid-template-columns:minmax(72px,22%) minmax(0,1fr);gap:8px;align-items:baseline}
.raw-facts dt,.raw-facts dd{margin:0;overflow-wrap:anywhere;font-size:12px;line-height:1.6}
.raw-facts dt{color:var(--workspace-muted)}
.raw-facts dd{color:var(--workspace-ink)}
.raw-alert{margin:5px 0 10px;color:var(--detail-amber);font-size:12px;line-height:1.6;overflow-wrap:anywhere}
#detail-panel-raw .raw-topic{margin:0;padding:0;border:0;border-top:1px solid var(--workspace-line);border-radius:0;background:transparent}
#detail-panel-raw .raw-topic>summary{display:flex;align-items:baseline;gap:7px;padding:8px 2px;min-height:36px;list-style:none;color:var(--workspace-ink);font-size:13px;font-weight:500;line-height:1.5}
#detail-panel-raw .raw-topic>summary::-webkit-details-marker{display:none}
#detail-panel-raw .raw-topic>summary::before{content:"";display:inline-block;width:5px;height:5px;flex:0 0 5px;align-self:baseline;margin:0 3px 2px 1px;border-inline-end:1.5px solid var(--workspace-muted);border-block-end:1.5px solid var(--workspace-muted);transform:rotate(-45deg)}
#detail-panel-raw .raw-topic[open]>summary::before{transform:translateY(-2px) rotate(45deg)}
#detail-panel-raw .raw-topic>summary::after{display:none}
#detail-panel-raw .raw-topic> :not(summary){margin-inline:0}
#detail-panel-raw .raw-topic .detail-group{border:0}
#detail-panel-raw .raw-topic>summary{min-height:44px;padding-block:11px;font-weight:600;scroll-margin-block-start:48px}
#detail-panel-raw .raw-fields{margin:0 0 14px;padding:0}
.raw-fields>div{display:grid;grid-template-columns:minmax(72px,22%) minmax(0,1fr);gap:8px;padding:4px 0;align-items:baseline}
.raw-fields dt,.raw-fields dd{margin:0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.raw-fields dt{color:var(--workspace-muted);font-size:12px}
.raw-fields dd{min-width:0;white-space:pre-wrap;color:var(--workspace-ink)}
.raw-field-note{display:block;margin-top:2px;font-size:12px;color:var(--workspace-muted);line-height:1.5}
.raw-entry-title{margin:7px 0 4px;font-size:13px;line-height:1.55;font-weight:600;overflow-wrap:anywhere}
.raw-evidence-label{margin:5px 0 2px;font-size:12px;color:var(--workspace-muted)}
.raw-entry .detail-list{margin:0 0 12px;padding-inline-start:1.2em;font-size:13px;overflow-wrap:anywhere}
.raw-subheading{margin:8px 0 3px;font-size:12px;font-weight:550;color:var(--workspace-muted)}
.raw-source-list{list-style:none;margin:0 0 14px;padding:0}
.raw-source-list li{margin:4px 0 8px}
.raw-source-list span,.raw-source-list code{display:block;font-size:12px;overflow-wrap:anywhere}
.raw-source-list code{color:var(--workspace-muted);font:11px/1.5 ui-monospace,monospace}
.raw-dispatch{margin:0 0 14px;color:var(--workspace-ink);font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
#detail-panel-raw #raw-read-status:empty{display:none}
@media(max-width:340px){#detail-identity .detail-heading{flex-basis:100%}}
@media(max-width:400px){
  #detail-tabs [role=tab]{font-size:12px}
  .detail-event-heading{gap:1px 6px}
}
@media(max-width:640px){
  #step-list{--tree-gap:6px;--tree-indent:13px;--tree-limit:48px;--tree-icon:19px;--tree-reading:clamp(57px,19%,78px)}
  .branch-subject{grid-template-columns:fit-content(36%) auto minmax(0,1fr);row-gap:1px}
  .branch-title{grid-column:2 / -1}
  .branch-meta,.branch-kind{grid-area:2 / 2}
  .branch-subject:has(>.branch-kind)>.branch-meta{grid-column:3}
  #package-filter{flex:1;max-width:48%}
  .plan-flat .tree-tools{align-items:stretch;gap:6px}.plan-flat .task-find{flex:1 0 100%;margin-bottom:0}.plan-flat .status-filter-label{flex:1;min-width:0}.plan-flat .status-filter-label select{width:100%;max-width:100%}
}
@media(max-width:430px){
  .plan-row:is([data-depth="5"],[data-depth="6"],[data-depth="7"]) .plan-subject{grid-template-columns:minmax(0,1fr);row-gap:1px}
  .plan-branch:is([data-depth="5"],[data-depth="6"],[data-depth="7"])>.plan-branch-head>.branch-subject{grid-template-columns:auto minmax(0,1fr)}
  .plan-branch:is([data-depth="5"],[data-depth="6"],[data-depth="7"])>.plan-branch-head :is(.branch-number,.branch-title){grid-column:1 / -1;grid-row:auto}
  .plan-branch:is([data-depth="5"],[data-depth="6"],[data-depth="7"])>.plan-branch-head :is(.branch-kind,.branch-meta){grid-row:3;grid-column:auto}
}
@media(min-width:390px) and (max-width:640px){#step-list{--tree-reading:84px}}
@media(max-width:360px){#step-list{--tree-pad:2px;--tree-gap:4px;--tree-indent:10px;--tree-limit:34px}}
</style>
<style>
#step-list .dependency-wait{margin:0;padding:0 0 8px;align-items:center;gap:5px}#step-list .dependency-link{min-height:28px}#step-list .dependency-target{outline:1px solid var(--workspace-accent);outline-offset:2px;border-radius:5px;background:var(--workspace-wash)}#step-list .dependency-source .plan-title{color:var(--workspace-accent)}
</style>
</head>
<body>
<main class="card" aria-label="任务进度">
  <div id="compact-view" class="compact-view hidden" aria-label="任务进度入口">
    <div class="compact-copy"><span class="compact-brand">Task Progress</span><strong id="compact-title" class="compact-title">当前会话任务</strong><span id="compact-status" class="compact-status">进度面板已收起</span></div>
    <button id="open-progress" class="compact-open" type="button">打开任务进度</button>
    <span id="compact-feedback" class="compact-feedback hidden" role="status" aria-live="polite"></span>
  </div>
  <p id="superseded-notice" class="superseded-notice hidden" role="status">此进度卡片已折叠，请查看本会话最新的任务进度。</p>
  <header class="header">
    <div class="topline"><div class="eyebrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="brandmark" aria-hidden="true" focusable="false">
  <g fill="#647BFF">
    <path d="M16 10v7M5 23v-3a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3v3M16 17v6" fill="none" stroke="#647BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12" y="2" width="8" height="9" rx="3"/>
    <rect x="1" y="22" width="8" height="8" rx="2.5"/>
    <rect x="12" y="22" width="8" height="8" rx="2.5"/>
    <rect x="23" y="22" width="8" height="8" rx="2.5"/>
  </g>
</svg>Task Progress</div><div class="topline-actions"><span id="auto-refresh-status" class="auto-refresh-status hidden" aria-live="polite"><span class="auto-refresh-dot" aria-hidden="true"></span><span id="auto-refresh-label">自动刷新暂停</span><time id="auto-refresh-time" class="auto-refresh-time"></time></span><button class="refresh" id="open-progress-panel" type="button">打开进度页</button><button class="refresh hidden" id="export-all" type="button" title="同时导出任务 Excel 和可视化 HTML">↓ 导出</button><button class="refresh" id="refresh" disabled title="刷新当前会话进度"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13 6A5.3 5.3 0 1 0 13 10M13 2v4H9"/></svg><span id="refresh-label">刷新</span></button></div></div>
  <p id="export-feedback" class="export-feedback hidden" role="status" aria-live="polite"></p>
    <div id="summary" class="hidden">
      <div class="titleline"><h1 id="task-title"></h1><span id="task-status" class="badge"><span class="dot" aria-hidden="true"></span><span id="task-status-label"></span></span></div>
      <div id="leaf-progress">
        <div class="progressline"><span id="fraction" class="fraction"></span><span class="progress-percent"><span id="percent">0</span>%</span></div>
        <div id="progressbar" class="track" role="progressbar" aria-label="叶任务验收进度" aria-valuemin="0" aria-valuemax="100"><div id="fill" class="fill"><span class="progress-sheen" aria-hidden="true"></span></div></div>
      </div>
      <section id="package-overview" class="hidden" aria-label="当前主任务概况">
        <div id="package-chart"><div class="package-heading"><strong>工作包分布</strong></div><div id="package-grid" role="group" aria-label="按工作包筛选，再点一次取消"></div><div id="package-tooltip" aria-hidden="true" hidden></div><div id="package-legend"></div><button type="button" id="package-selection" hidden></button></div>
      </section>
    </div>
  </header>
  <section id="session-work" class="session-work hidden" aria-label="会话请求"></section>
  <section id="empty" class="empty"><span class="empty-icon" aria-hidden="true">☷</span><h2>任务进度</h2><p id="empty-message" role="status">正在准备进度面板。</p><button id="read-retry" type="button">重试</button></section>
  <section id="steps-section" class="steps-section hidden" role="tabpanel" aria-labelledby="workspace-tab-plan" aria-label="任务步骤"><div class="sectionline"><h2 id="steps-title">执行步骤</h2></div><p id="status-scope" class="progress-context hidden">包含并行任务</p><div id="status-chips" class="status-chips" role="group" aria-label="按叶任务状态筛选"></div><p id="filter-empty" class="network-help hidden" role="status">没有符合条件的任务。<button id="clear-plan-filters" type="button">清除筛选</button></p><p id="network-help" class="network-help hidden">任务可展开查看依赖、结果与派发信息；百分比仅表示主任务中已解决且通过当前验收协议的叶任务；各根任务综合验收单独记录。</p><section id="step-browser" hidden aria-label="执行步骤">
    <div id="step-table"><div id="step-list" role="list" aria-label="执行计划树"></div></div>
    <div id="step-page" aria-label="根任务分页"><span id="step-page-range" role="status"></span><span id="step-page-total"></span><button id="step-page-prev" type="button">上一页</button><span id="step-page-index"></span><button id="step-page-next" type="button">下一页</button></div>

  </section>
  <dialog id="step-dialog" aria-label="步骤详情"><nav id="step-detail-nav" aria-label="步骤位置"><span id="step-detail-path"></span><button id="step-detail-back" type="button">关闭</button></nav><div id="step-dialog-body">
    <header id="detail-identity"><h2 id="detail-name" class="detail-heading"></h2><span id="detail-state" class="detail-state"></span></header>
    <div id="detail-tabs" role="tablist" aria-label="任务详情视图">
      <button type="button" role="tab" id="detail-tab-result" data-tab="result" aria-controls="detail-panel-result" aria-selected="true">结果</button>
      <button type="button" role="tab" id="detail-tab-records" data-tab="records" aria-controls="detail-panel-records" aria-selected="false" tabindex="-1">记录</button>
      <button type="button" role="tab" id="detail-tab-raw" data-tab="raw" aria-controls="detail-panel-raw" aria-selected="false" tabindex="-1">原始信息</button>
    </div>
    <section id="detail-panel-result" role="tabpanel" aria-labelledby="detail-tab-result" tabindex="0"></section>
    <section id="detail-panel-records" role="tabpanel" aria-labelledby="detail-tab-records" tabindex="0" hidden></section>
    <section id="detail-panel-raw" role="tabpanel" aria-labelledby="detail-tab-raw" tabindex="0" hidden>
      <div id="detail-raw-fields"></div><p id="raw-read-status" role="status"></p>
      <button id="raw-retry" type="button" data-retry-detail-records hidden>重试</button>
    </section>
  </div></dialog>
  <dialog id="step-search-dialog" aria-labelledby="step-search-heading"><form>
    <div class="search-dialog-header"><h2 id="step-search-heading">搜索步骤</h2><button id="search-dialog-close" type="button">关闭</button></div>
    <input type="search" id="step-search" aria-label="搜索任务名称、ID 或执行者" placeholder="搜索步骤、工作包或负责人" autocomplete="off">
    <p id="search-dialog-context"></p><div id="peer-package-options" role="group" aria-label="筛选并行工作包" hidden></div><p id="search-dialog-result" role="status"></p>
    <div class="search-dialog-actions"><button type="button" id="search-query-clear">清除搜索</button><button type="submit" id="search-dialog-done">查看结果</button></div>
  </form></dialog>
  <ol id="steps" class="steps"></ol></section>
  <section id="plan-history-panel" class="workspace-panel workspace-panel-hidden" role="tabpanel" aria-labelledby="workspace-tab-revisions"><p id="plan-history-empty" class="workspace-empty">暂无历史计划或修订</p>
  <details id="history-section" class="history-section hidden"><summary id="history-title">历史计划</summary><ol id="history-list" class="history-list"></ol></details>
  </section>
  <section id="task-history-panel" class="workspace-panel workspace-panel-hidden" role="tabpanel" aria-labelledby="workspace-tab-archives"><p id="task-history-empty" class="workspace-empty">暂无历史任务</p>
  <details id="task-history-section" class="history-section hidden"><summary id="task-history-title">历史任务</summary><ol id="task-history-list" class="history-list"></ol></details>
  <details id="legacy-history-section" class="history-section hidden"><summary id="legacy-history-title">旧版记录 · 只读</summary><div id="legacy-history-list" class="history-meta"></div></details>
  </section>
  <p id="display-feedback" class="export-feedback hidden" role="status" aria-live="polite"></p>
  <p id="error" class="error hidden" role="alert"></p>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const setText = (id, value) => { const element = $(id); const text = String(value); if (element.textContent !== text) element.textContent = text; };
  let sessionId = null;
  // A host may pin the view identity (the DeepSeekRuntime right-sidebar tab does):
  // a remount then renews its own lease instead of colliding with the lease its

  const pinnedViewId = (() => {
    try {
      const value = new URLSearchParams(location.search).get('view_id');
      return typeof value === 'string' && /^[A-Za-z0-9._:-]{1,120}$/.test(value) ? value : null;
    } catch (_) { return null; }
  })();
  const viewId = pinnedViewId || 'view-' + (globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
  let displayMode = null;
  let availableDisplayModes = null;
  let displayIntent = null;
  let displayIntentSettled = true;
  let autoFullscreenBlocked = false;
  const handledDisplayIntents = new Set();
  let viewRegistrationStarted = false;
  let viewRetryTimer = null;
  let viewRetryDelay = 1000;
  let viewRegistered = false;
  let viewTimer = null;
  let viewHeartbeatTimer = null;
  let registeredMode = null;
  let registeredSourceKey = null;
  let viewCheckBusy = false;
  let sourceSuperseded = false;
  let hiddenByFullscreen = false;
  let disposed = false;
  let bridgeReady = false;
  let activeRead = null;
  let silentRefresh = false;
  let refreshQueued = false;
  let pollTimer = null;
  let hasCurrentProgress = false;
  let latestProgress = null;
  let sessionWork = null;
  let latestStateRevision = null;
  let minimumStateRevision = null;
  let fullHistorySnapshot = null;
  let historyLoad = null;
  let historyLoadError = "";

  let hostCapabilities = {};
  let rpcId = 0;
  const pending = new Map();
  const statusInfo = value => {
    if (value === 'completed' || value === 'complete' || value === 'resolved') return { key: 'completed', label: '已完成' };

  function base64FromBytes(bytes) {

  async function exportCurrentProgress() {
